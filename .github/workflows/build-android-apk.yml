name: Build Android APK

on:
  push:
    branches: [codex/rebuild-apk]
    paths:
      - app/android/**
      - app/index.html
      - app/styles.css
      - app/app.js
      - app/manifest.webmanifest
      - app/new_logo_mark.jpg
      - .github/workflows/build-android-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build and verify APK
        run: |
          gradle --no-daemon --project-dir app/android :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hertz-haven-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Add APK to website files
        run: |
          mkdir -p app/dist web/public
          cp app/android/app/build/outputs/apk/debug/app-debug.apk app/dist/Hertz-Haven.apk
          cp app/android/app/build/outputs/apk/debug/app-debug.apk web/public/Hertz-Haven.apk
          cp app/android/app/build/outputs/apk/debug/app-debug.apk web_app/Hertz-Haven.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dist/Hertz-Haven.apk web/public/Hertz-Haven.apk web_app/Hertz-Haven.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add updated Android APK'
          git push origin "HEAD:$GITHUB_REF_NAME"
